<!-- ============================================================
  Rhapsody | Customer logo wall (bracket treatment)
  Paste this entire block into a Custom HTML block in the CMS.

  HOW TO EDIT
  * Set a logo:     open the logo in the Media Library, copy its
                    File URL, paste it into src="...". Put the
                    customer's name in alt="...".
  * Add a logo:     copy any one <li class="rh-lw__item">...</li>
                    line and paste it anywhere inside the list.
  * Remove a logo:  delete its <li>...</li> line.
                    Bracket colors reassign themselves automatically
                    (blue > teal > purple, repeating) so no two
                    side-by-side logos ever match.
  * Resize:         change the one --rh-arc value below. Every
                    bracket in the wall shares that frame size and
                    each logo auto-fits inside it, per brand
                    guideline (logo height is capped at about
                    two-thirds of the arc height).
  * Logos per row:  --rh-max-row sets how many logos sit on one row
                    (default 6). Tiles shrink evenly if the page
                    column is narrow, so you never get an awkward
                    5-and-1 split. Extra logos wrap to a centered
                    row below (e.g. 7 logos with --rh-max-row:4
                    gives a staggered 4-over-3 arrangement).
  * Logo too big /  --rh-logo-w and --rh-logo-h cap the logo's size
    touching arcs:  inside the frame. Lower them (e.g. 44% / 36%)
                    if a logo crowds the brackets. If a logo sits
                    off-center or overlaps one arc, the image file
                    itself has uneven empty space around the mark;
                    crop it tight to the artwork in the Media
                    Library (Edit Image > Crop) and it will center
                    itself.

  LOGO FILE CHECKLIST (from the brand guide)
  current official version / permission confirmed / high resolution /
  transparent background (PNG or SVG, never a white box)
============================================================= -->
<div class="rh-lw">
  <style>
    .rh-lw{--rh-arc:120px;--rh-max-row:6;--rh-gap-x:30px;--rh-gap-y:44px;--rh-logo-w:50%;--rh-logo-h:42%;display:flex;justify-content:center;}
    .rh-lw ul.rh-lw__list{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:var(--rh-gap-y) var(--rh-gap-x);width:100%;margin:0 auto;padding:0;list-style:none;box-sizing:border-box;max-width:calc(var(--rh-max-row)*var(--rh-arc) + (var(--rh-max-row) - 1)*var(--rh-gap-x));}
    .rh-lw li.rh-lw__item{list-style:none;margin:0;padding:0;flex:none;width:min(var(--rh-arc),calc((100% - (var(--rh-max-row) - 1)*var(--rh-gap-x))/var(--rh-max-row)));aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background-repeat:no-repeat;background-position:center;background-size:contain;}
    .rh-lw li.rh-lw__item::before,.rh-lw li.rh-lw__item::marker{content:none;}
    .rh-lw .rh-lw__item img{display:block;width:auto;height:auto;max-width:var(--rh-logo-w);max-height:var(--rh-logo-h);margin:0;padding:0;border:none;box-shadow:none;}
    .rh-lw li.rh-lw__item:nth-child(3n+1){background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M27.1 17.2A40 40 0 0 0 27.1 82.8' fill='none' stroke='%231A81F4' stroke-width='5' stroke-linecap='round'/><path d='M72.9 17.2A40 40 0 0 1 72.9 82.8' fill='none' stroke='%231A81F4' stroke-width='5' stroke-linecap='round'/></svg>");}
    .rh-lw li.rh-lw__item:nth-child(3n+2){background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M27.1 17.2A40 40 0 0 0 27.1 82.8' fill='none' stroke='%2323C5BF' stroke-width='5' stroke-linecap='round'/><path d='M72.9 17.2A40 40 0 0 1 72.9 82.8' fill='none' stroke='%2323C5BF' stroke-width='5' stroke-linecap='round'/></svg>");}
    .rh-lw li.rh-lw__item:nth-child(3n){background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M27.1 17.2A40 40 0 0 0 27.1 82.8' fill='none' stroke='%237340E4' stroke-width='5' stroke-linecap='round'/><path d='M72.9 17.2A40 40 0 0 1 72.9 82.8' fill='none' stroke='%237340E4' stroke-width='5' stroke-linecap='round'/></svg>");}
    @media (max-width:640px){.rh-lw{--rh-arc:92px;--rh-max-row:3;--rh-gap-x:18px;--rh-gap-y:28px;}}
  </style>
  <ul class="rh-lw__list">
    <li class="rh-lw__item"><img src="PASTE-LOGO-URL-HERE" alt="Customer name" loading="lazy"></li>
    <li class="rh-lw__item"><img src="PASTE-LOGO-URL-HERE" alt="Customer name" loading="lazy"></li>

    <li class="rh-lw__item"><img src="PASTE-LOGO-URL-HERE" alt="Customer name" loading="lazy"></li>
    <li class="rh-lw__item"><img src="PASTE-LOGO-URL-HERE" alt="Customer name" loading="lazy"></li>
    <li class="rh-lw__item"><img src="PASTE-LOGO-URL-HERE" alt="Customer name" loading="lazy"></li>
  </ul>
</div>
