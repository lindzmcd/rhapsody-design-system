<!--
  RHAPSODY EMAIL SIGNATURE — WITH CERTIFICATION BADGES
  =====================================================================
  For roles required to display compliance badges (e.g., Cyber Essentials
  Plus, ISO 27001). Same base signature as the standard file, plus a small
  badge row below.

  TO DEPLOY:
  1) Logo: host Rhapsody_logo_primary.png and replace LOGO_URL_HERE.
  2) Badges: host the OFFICIAL badge artwork issued by each certifying body
     (get the approved files from Security/Compliance, do not recreate or
     recolor them) and replace CERT1_URL_HERE / CERT2_URL_HERE. Add or
     remove <img> badge cells to match the roles actual certifications.
     Keep each badge ~44px tall; do not stretch, crop, or restyle them.
  3) Map the [bracketed] fields to your directory / signature tool.
  Colors: Navy #0B2C47 · Rhapsody Blue #1A81F4 · Teal #23C5BF · Gray #7E858C
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:'Poppins',Arial,Helvetica,sans-serif;">
  <tr>
    <td style="padding:0 16px 0 0;vertical-align:middle;">
      <img src="LOGO_URL_HERE" alt="Rhapsody" width="132" height="19" style="display:block;border:0;outline:none;text-decoration:none;height:auto;">
    </td>
    <td width="2" style="width:2px;background-color:#23C5BF;font-size:0;line-height:0;">&nbsp;</td>
    <td style="padding:0 0 0 16px;vertical-align:middle;font-family:'Poppins',Arial,Helvetica,sans-serif;color:#0B2C47;line-height:1.35;">
      <div style="font-size:15px;font-weight:600;color:#0B2C47;">[First Last]</div>
      <div style="font-size:13px;font-weight:400;color:#7E858C;padding-top:2px;">[Job Title]</div>
      <div style="font-size:12px;color:#7E858C;padding-top:8px;">[+1 555 000 0000]&nbsp;&nbsp;&middot;&nbsp;&nbsp;<a href="mailto:[name@rhapsody.health]" style="color:#7E858C;text-decoration:none;">[name@rhapsody.health]</a></div>
      <div style="padding-top:4px;"><a href="https://rhapsody.health" style="font-size:12px;font-weight:600;color:#1A81F4;text-decoration:none;">rhapsody.health&nbsp;&#8594;</a></div>
    </td>
  </tr>
  <!-- Certification badge row (required roles only). Remove cells that don't apply. -->
  <tr>
    <td colspan="3" style="padding:12px 0 0 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td style="padding:0 10px 0 0;vertical-align:middle;"><img src="CERT1_URL_HERE" alt="Cyber Essentials Plus certified" height="44" style="display:block;border:0;outline:none;height:44px;width:auto;"></td>
          <td style="vertical-align:middle;"><img src="CERT2_URL_HERE" alt="ISO 27001 certified" height="44" style="display:block;border:0;outline:none;height:44px;width:auto;"></td>
        </tr>
      </table>
    </td>
  </tr>
</table>
